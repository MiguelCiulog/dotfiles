# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

# bindd = SUPER SHIFT, Q, Close active window, killactive,
bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, E, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Mail, exec, omarchy-launch-webapp "https://mail.google.com"
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Move focus with SUPER + arrow keys
bindd = SUPER, h, Move focus left, movefocus, l
bindd = SUPER, l, Move focus right, movefocus, r
bindd = SUPER, k, Move focus up, movefocus, u
bindd = SUPER, j, Move focus down, movefocus, d

bindd = SUPER CTRL, l, Next workspace, workspace, e+1
bindd = SUPER CTRL, h, Previous workspace, workspace, e-1
bindd = SUPER CTRL, right, Next workspace, workspace, e+1
bindd = SUPER CTRL, left, Previous workspace, workspace, e-1

# Move the current workspace to the left monitor
bindd = SUPER CTRL SHIFT, h, Move current workspace to left monitor, movecurrentworkspacetomonitor, l

# Move the current workspace to the right monitor
bindd = SUPER CTRL SHIFT, l, Move current workspace to left monitor, movecurrentworkspacetomonitor, r

unbind = SUPER, J
bindd = SUPER SHIFT, J, Toggle split, togglesplit

unbind = SUPER, K
bindd = SUPER ALT, K, Show key bindings, exec, omarchy-menu-keybindings

unbind = SUPER, W
bindd = SUPER SHIFT, W, Close active window, killactive,

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
# bindd = SUPER SHIFT, SPACE, Omarchy menu, exec, omarchy-menu
