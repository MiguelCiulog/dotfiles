[directory]
read_only = " 󰌾"
style = "bold green"
truncation_length = 6
truncation_symbol = "…/"

[git_branch]
format = '[$branch]($style)'
symbol = " "
style = "bright-black"

[git_status]
format = '([ \[$all_status$ahead_behind\] ]($style))'
style = 'cyan'
conflicted = "X"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = "✓"
untracked = "?"
stashed = "≡"
modified = "!"
staged = '[++\($count\)](green)'
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# languages & stuff (only icons)

